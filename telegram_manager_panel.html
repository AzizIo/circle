<script>
const $=id=>document.getElementById(id);
const S={profile:"",profiles:[],authToken:"",recipientAccountLabel:"",chatPage:0,recipientPage:0,archivePage:0,archiveMediaPage:0,archiveUser:null,archiveTotal:0,archiveMediaTotal:0,chatSelected:new Set(),recipientSelected:new Set(),recipientInitialized:false,recipientDirty:false,chatTotal:0,recipientTotal:0,savedPosts:[],mediaCleanupPreview:null,logLoading:false,modalResolve:null,lastChatPoll:0,lastRecipientPoll:0,lastArchivePoll:0,lastProfilePoll:0,inflight:Object.create(null),latest:Object.create(null)};
const PAGE=100,REC_PAGE=100;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(n){return new Intl.NumberFormat("ru-RU").format(Number(n||0))}
function bytes(n){n=Number(n||0);if(n<1024)return n+" Б";const u=["КБ","МБ","ГБ","ТБ"];let i=-1;do{n/=1024;i++}while(n>=1024&&i<u.length-1);return n.toFixed(1)+" "+u[i]}
function toast(m,t){const x=$("toast");x.textContent=m;x.className="toast show "+(t||"");clearTimeout(toast.timer);toast.timer=setTimeout(()=>x.className="toast",4500)}
async function withButton(button,busyText,work){
 if(!button||button.disabled)return;
 const oldText=button.textContent;button.disabled=true;button.textContent=busyText;
 try{return await work()}finally{button.disabled=false;button.textContent=oldText}
}
function token(){return $("token").value.trim()||S.authToken||localStorage.getItem("circles_web_token")||""}
function setTokenUi(hasAccess){
 const box=$("tokenBox"),change=$("changeToken"),field=$("token");
 if(!box||!change||!field)return;
 box.hidden=!!hasAccess;change.hidden=!hasAccess;
 if(hasAccess){field.value="";field.placeholder="Ключ сохранён"}
 else{field.placeholder="Токен доступа"}
}
$("changeToken").onclick=()=>{setTokenUi(false);$("token").value="";$("token").focus()};
function url(path){return "/api/profiles/"+encodeURIComponent(S.profile)+path}
async function api(path,opts){
 opts=opts||{};
 const method=String(opts.method||"GET").toUpperCase();
 const key=method==="GET"?path:null;
 const requestToken=token(),requestProfile=S.profile;
 if(key&&S.inflight[key])return S.inflight[key];
 const controller=new AbortController();
 const slowTelegramRequest=path.includes("/broadcast/recipients")||path.endsWith("/broadcast/start");
 const timeoutMs=slowTelegramRequest?120000:30000;
 const timeout=setTimeout(()=>controller.abort(),timeoutMs);
 const task=(async()=>{
  try{
   const h={"Authorization":"Bearer "+requestToken};
   if(opts.body)h["Content-Type"]="application/json";
   const r=await fetch(path,{cache:"no-store",...opts,signal:controller.signal,headers:{...h,...(opts.headers||{})}});
   const raw=await r.text();let data={};
   try{data=raw?JSON.parse(raw):{}}catch(e){data={message:raw}}

async function loadArchiveCatalog(){
 const profile=S.profile,page=S.archivePage,query=$("archivePeopleSearch").value,version=(S.latest.archive=(S.latest.archive||0)+1);
 const feedback=$("archiveCatalogFeedback"),list=$("archivePeople");
 const updateControls=loading=>{
  if(S.profile!==profile||S.latest.archive!==version)return;
  $("refreshArchiveCatalog").disabled=!!loading;
  $("searchArchivePeople").disabled=!!loading;
  $("archivePeoplePrev").disabled=!!loading||S.archivePage===0;
  $("archivePeopleNext").disabled=!!loading||(S.archivePage+1)*50>=S.archiveTotal;
 };
 updateControls(true);
 if(feedback){feedback.textContent="Загружаю страницу "+(page+1)+"…";feedback.dataset.state="busy"}
 list.setAttribute("aria-busy","true");
 try{
  need();
  const q=new URLSearchParams({limit:"50",offset:String(page*50),query,compact:"1"});
  const [summary,data]=await Promise.all([api(url("/archive/summary")),api(url("/archive/people")+"?"+q)]);
  if(S.profile!==profile||S.archivePage!==page||$("archivePeopleSearch").value!==query||S.latest.archive!==version||document.querySelector(".page.active")?.id!=="page-archive")return;
  S.archiveTotal=Number(data.total)||0;
  $("arTopics").textContent=fmt(summary.topics);$("arTotal").textContent=fmt(summary.total);$("arSent").textContent=fmt(summary.sent);$("arPending").textContent=fmt(summary.pending);
  $("archivePeople").innerHTML=(data.items||[]).map(x=>'<div class="chatrow"><div class="pill">'+fmt(x.media_count)+'</div><div><div class="chatname">'+esc(x.title||("User "+x.user_id))+'</div><div class="chatmeta">ID '+esc(x.user_id)+' · отправлено '+fmt(x.sent_count)+' · ожидают '+fmt(x.pending_count)+' · последнее '+esc(x.last_media||"—")+'</div></div><span class="chatstatus pill good">Архив</span><button class="btn sm" data-user="'+esc(x.user_id)+'">Медиа</button></div>').join("")||'<div class="empty">В архиве пока нет тем.</div>';
  Array.from($("archivePeople").querySelectorAll("[data-user]")).forEach(b=>b.onclick=()=>{
   S.archiveUser=Number(b.dataset.user);S.archiveMediaPage=0;S.archiveMediaTotal=0;
   $("archiveMediaHeading").textContent="Telegram ID "+S.archiveUser+" · загружаю…";
   $("archiveMediaFeedback").textContent="Загружаю записи медиа…";$("archiveMediaFeedback").dataset.state="busy";
   $("archiveMedia").innerHTML='<div class="empty">Загружаю записи медиа…</div>';
   $("archiveMedia").setAttribute("aria-busy","true");
   $("archiveMediaPrev").disabled=true;$("archiveMediaNext").disabled=true;
   return loadArchivePersonMedia(b);
  });
  $("archivePeoplePage").textContent=data.total?((page*50+1)+"–"+Math.min((page+1)*50,data.total)+" из "+data.total):"Нет тем";
  if(feedback){feedback.textContent="Загружено: "+fmt((data.items||[]).length)+" из "+fmt(S.archiveTotal)+" · "+new Date().toLocaleTimeString("ru-RU");feedback.dataset.state="success"}
 }catch(e){
  if(S.profile===profile&&S.latest.archive===version){
   $("archivePeople").innerHTML='<div class="empty">'+esc(e.message)+'</div>';
   if(feedback){feedback.textContent="Не удалось загрузить каталог: "+e.message;feedback.dataset.state="error"}
   toast(e.message,"error");
  }
 }finally{
  if(S.profile===profile&&S.latest.archive===version){list.setAttribute("aria-busy","false");updateControls(false)}
 }
}
async function loadArchivePersonMedia(triggerButton){
 const profile=S.profile,user=Number(S.archiveUser),page=S.archiveMediaPage;
 if(!profile||!user)return false;
 const version=(S.latest.archiveMedia=(S.latest.archiveMedia||0)+1);
 const feedback=$("archiveMediaFeedback"),list=$("archiveMedia");
 const triggerText=triggerButton?triggerButton.textContent:"";
 const current=()=>S.profile===profile&&Number(S.archiveUser)===user&&S.archiveMediaPage===page&&S.latest.archiveMedia===version;
 if(triggerButton){triggerButton.disabled=true;triggerButton.textContent="Загружаю…"}
 $("archiveMediaPrev").disabled=true;$("archiveMediaNext").disabled=true;
 list.setAttribute("aria-busy","true");
 if(feedback){feedback.textContent="Загружаю записи…";feedback.dataset.state="busy"}
 $("archiveMediaHeading").textContent="Telegram ID "+user+" · загрузка…";
 list.innerHTML='<div class="empty">Загружаю записи медиа…</div>';
 try{
  need();
  const q=new URLSearchParams({limit:"30",offset:String(page*30),compact:"1"});
  const d=await api(url("/archive/people/"+user+"/media")+"?"+q);
  if(!current()||document.querySelector(".page.active")?.id!=="page-archive")return false;
  S.archiveMediaTotal=Number(d.total)||0;
  $("archiveMediaHeading").textContent="Telegram ID "+user+" · "+fmt(S.archiveMediaTotal)+" записей";
  list.innerHTML=(d.items||[]).map(x=>'<div class="chatrow"><div class="pill">'+esc(x.media_type||"media")+'</div><div><div class="chatname">Сообщение #'+esc(x.msg_id)+' · '+esc(x.file_name||"файл не прикреплён")+'</div><div class="chatmeta">'+esc(x.date_utc||"—")+' · '+bytes(x.file_size)+' · '+(x.outgoing?"исходящее":"входящее")+'</div></div><span class="chatstatus pill '+(x.sent?"good":"warn")+'">'+(x.sent?"Отправлено":"Ожидает")+'</span><span class="pill '+(x.file_available?"good":"warn")+'">'+(x.file_available?"На диске":"Нет файла")+'</span></div>').join("")||'<div class="empty">У этого человека нет записей медиа.</div>';
  $("archiveMediaPage").textContent=d.total?((page*30+1)+"–"+Math.min((page+1)*30,d.total)+" из "+d.total):"Нет записей";
  if(feedback){feedback.textContent="Загружено: "+fmt((d.items||[]).length)+" из "+fmt(S.archiveMediaTotal);feedback.dataset.state="success"}
  return true;
 }catch(e){
  if(current()){
   list.innerHTML='<div class="empty">'+esc(e.message)+'</div>';
   if(feedback){feedback.textContent="Не удалось загрузить медиа: "+e.message;feedback.dataset.state="error"}
   toast(e.message,"error");
  }
  return false;
 }finally{
  if(triggerButton&&triggerButton.isConnected){triggerButton.disabled=false;triggerButton.textContent=triggerText}
  if(current()){
   list.setAttribute("aria-busy","false");
   $("archiveMediaPrev").disabled=page===0;
   $("archiveMediaNext").disabled=(page+1)*30>=S.archiveMediaTotal;
  }
 }
}

$("saveArchive").onclick=()=>withButton($("saveArchive"),"Сохраняю…",async()=>{const types=[];if($("mediaRound").checked)types.push("round_video");if($("mediaPhoto").checked)types.push("photo");if($("mediaVideo").checked)types.push("video");await api(url("/settings"),{method:"PATCH",body:JSON.stringify({paused:$("archivePaused").checked,save_outgoing:$("archiveOutgoing").checked,info_message:$("archiveInfo").checked,keep_local:$("archiveLocal").checked,archive_media_types:types,target_chat_id:Number($("archiveTarget").value||0)})});toast("Настройки архиватора сохранены","success");await loadDashboard()}).catch(e=>toast(e.message,"error"));
function drawAccounts(){$("accountList").innerHTML=S.profiles.map(p=>'<div class="accountitem"><div class="accounttext"><b>'+esc(p.label||p.name)+'</b><div class="smalltext">'+esc(p.name)+" · "+esc(p.status)+'</div></div><span class="pill '+(p.active?"good":"warn")+'">'+(p.active?"Онлайн":"Оффлайн")+'</span><div class="toolbar">'+(p.can_start?'<button class="btn sm" data-start="'+esc(p.name)+'">Запустить</button>':"")+(p.can_stop?'<button class="btn sm danger" data-stop="'+esc(p.name)+'">Остановить</button>':"")+'</div></div>').join("")||'<div class="empty">Профили отсутствуют</div>';Array.from($("accountList").querySelectorAll("[data-start]")).forEach(b=>b.onclick=()=>withButton(b,"Запускаю…",async()=>{const name=b.dataset.start;await api("/api/profiles/"+name+"/start",{method:"POST",body:"{}"});toast("Запрос запуска профиля «"+name+"» принят. Обновляю статус…","success");try{await loadProfiles()}catch(e){toast("Запрос принят, но статус профиля не обновлён: "+e.message,"error")}}).catch(e=>toast("Не удалось запустить профиль: "+e.message,"error")));Array.from($("accountList").querySelectorAll("[data-stop]")).forEach(b=>b.onclick=()=>withButton(b,"Останавливаю…",async()=>{const name=b.dataset.stop;await api("/api/profiles/"+name+"/stop",{method:"POST",body:"{}"});toast("Запрос остановки профиля «"+name+"» принят. Обновляю статус…","success");try{await loadProfiles()}catch(e){toast("Запрос принят, но статус профиля не обновлён: "+e.message,"error")}}).catch(e=>toast("Не удалось остановить профиль: "+e.message,"error")))}
$("reloadProfiles").onclick=()=>withButton($("reloadProfiles"),"Обновляю…",async()=>{await loadProfiles();toast("Список профилей обновлён","success")}).catch(e=>toast("Не удалось обновить профили: "+e.message,"error"));
$("createProfile").onclick=()=>withButton($("createProfile"),"Создаю…",async()=>{const name=$("newProfileName").value.trim();await api("/api/accounts",{method:"POST",body:JSON.stringify({name})});$("newProfileName").value="";toast("Профиль «"+name+"» создан. Обновляю список…","success");try{await loadProfiles();$("authProfile").value=name}catch(e){toast("Профиль создан, но список не обновлён: "+e.message,"error")}}).catch(e=>toast("Профиль не создан: "+e.message,"error"));
$("sendLoginCode").onclick=()=>withButton($("sendLoginCode"),"Отправляю…",async()=>{const name=$("authProfile").value;if(!name)throw new Error("Сначала создай профиль");$("authMessage").textContent="Отправляю запрос на код Telegram для профиля "+name+"…";try{const d=await api("/api/profiles/"+name+"/login/start",{method:"POST",body:JSON.stringify({phone:$("authPhone").value})});$("authMessage").textContent=d.message;toast(d.message,"success")}catch(e){$("authMessage").textContent="Запрос кода не выполнен: "+e.message;throw e}}).catch(e=>toast(e.message,"error"));
$("submitLoginCode").onclick=()=>withButton($("submitLoginCode"),"Проверяю код…",async()=>{const name=$("authProfile").value;$("authMessage").textContent="Проверяю код Telegram…";try{const d=await api("/api/profiles/"+name+"/login/code",{method:"POST",body:JSON.stringify({code:$("authCode").value})});$("authCode").value="";$("authMessage").textContent=d.message;toast(d.message,"success");if(d.stage==="done"){try{await loadProfiles()}catch(e){$("authMessage").textContent="Авторизация завершена, но список профилей не обновлён: "+e.message;toast("Авторизация прошла, но статус не обновился: "+e.message,"error")}}}catch(e){$("authMessage").textContent="Код не принят: "+e.message;throw e}}).catch(e=>toast(e.message,"error"));
$("submitLoginPassword").onclick=()=>withButton($("submitLoginPassword"),"Проверяю 2FA…",async()=>{const name=$("authProfile").value;$("authMessage").textContent="Проверяю пароль двухфакторной защиты…";try{const d=await api("/api/profiles/"+name+"/login/password",{method:"POST",body:JSON.stringify({password:$("authPassword").value})});$("authPassword").value="";$("authMessage").textContent=d.message;toast(d.message,"success");if(d.stage==="done"){try{await loadProfiles()}catch(e){$("authMessage").textContent="Авторизация завершена, но список профилей не обновлён: "+e.message;toast("Авторизация прошла, но статус не обновился: "+e.message,"error")}}}catch(e){$("authMessage").textContent="Пароль не принят: "+e.message;throw e}}).catch(e=>toast(e.message,"error"));
async function loadLogs(){if(S.logLoading)return;S.logLoading=true;const box=$("logBox");const wasNearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;const profile=S.profile,kind=$("logKind").value,lines=$("logLines").value,level=$("logLevel").value,query=$("logSearch").value,version=(S.latest.logs=(S.latest.logs||0)+1);try{need();const q=new URLSearchParams({kind,lines,level,q:query,compact:"1"});const d=await api(url("/logs")+"?"+q);if(S.profile!==profile||S.latest.logs!==version||kind!==$("logKind").value||lines!==$("logLines").value||level!==$("logLevel").value||query!==$("logSearch").value||document.querySelector(".page.active")?.id!=="page-logs")return;const counts=d.counts||{};$("logCountInfo").textContent=fmt(counts.INFO||0);$("logCountWarning").textContent=fmt(counts.WARNING||0);$("logCountError").textContent=fmt(counts.ERROR||0);$("logCountCritical").textContent=fmt(counts.CRITICAL||0);$("logMeta").textContent=d.path+" · показано "+fmt(d.count)+" из "+fmt(d.total_count||d.count)+" · обновлено "+new Date().toLocaleTimeString("ru-RU");$("logLiveState").textContent=$("logAuto").checked?"● LIVE":"Ⅱ ПАУЗА";$("logLiveState").className="pill "+($("logAuto").checked?"good":"warn");const entries=d.entries||[];box.innerHTML=entries.map(e=>'<article class="logentry level-'+esc(e.level)+'"><time class="logtime">'+esc(e.timestamp||"—")+'</time><span class="loglevel">'+esc(e.level)+'</span><span class="logmessage">'+esc(e.message||e.raw||"")+'</span></article>').join("")||'<div class="empty">По этим фильтрам событий нет.</div>';if($("logAutoScroll").checked&&wasNearBottom)box.scrollTop=box.scrollHeight}catch(e){if(S.profile===profile){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>';toast(e.message,"error")}}finally{S.logLoading=false}}
$("loadLogs").onclick=loadLogs;$("refreshLogs").onclick=loadLogs;$("logKind").onchange=loadLogs;$("logLines").onchange=loadLogs;$("logLevel").onchange=loadLogs;let logSearchTimer=null;$("logSearch").oninput=()=>{clearTimeout(logSearchTimer);logSearchTimer=setTimeout(loadLogs,250)};$("logAuto").onchange=()=>{$("logLiveState").textContent=$("logAuto").checked?"● LIVE":"Ⅱ ПАУЗА";$("logLiveState").className="pill "+($("logAuto").checked?"good":"warn");if($("logAuto").checked)loadLogs()};
async function boot(){
 const t=localStorage.getItem("circles_web_token");
 if(t){
  S.authToken=t;
  try{
   await loadProfiles();
   if(S.profile){
    setTokenUi(true);
    try{await loadDashboard()}catch(e){toast("Доступ подтверждён, но обзор не обновлён: "+e.message,"error")}
   }
  }catch(e){S.authToken="";connected(false);setTokenUi(false);toast("Ошибка подключения: "+e.message,"error")}
 }
 const h=location.hash.slice(1);if(h&&titles[h])go(h)
}
boot();
setInterval(()=>{
 if(document.hidden||!token()||!S.profile)return;
 const active=document.querySelector(".page.active");
 const editing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
 if(active&&active.id==="page-broadcast"){
  loadBroadcast().catch(()=>{});
  if(!S.recipientDirty&&document.activeElement!==$("recipientSearch")&&Date.now()-S.lastRecipientPoll>30000){
   S.lastRecipientPoll=Date.now();loadRecipients(false).catch(()=>{});
  }
 }else if(active&&active.id==="page-overview")loadDashboard().catch(()=>{});
 else if(active&&active.id==="page-chats"&&Date.now()-S.lastChatPoll>20000){
  S.lastChatPoll=Date.now();loadChatStats().catch(()=>{});
  if(!editing&&!S.chatSelected.size)loadChats().catch(()=>{});
 }else if(active&&active.id==="page-archive"&&Date.now()-S.lastArchivePoll>30000&&!editing){
  S.lastArchivePoll=Date.now();loadArchiveCatalog().catch(()=>{});
 }else if(active&&active.id==="page-accounts"&&Date.now()-S.lastProfilePoll>30000&&!editing){
  S.lastProfilePoll=Date.now();loadProfiles().catch(()=>{});
 }else if(active&&active.id==="page-logs"&&$("logAuto").checked)loadLogs().catch(()=>{});
},8000);
</script></body></html>
