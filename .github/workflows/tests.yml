name: tests
on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:
jobs:
  unit-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q combined_multi_account.py broadcast_core.py smart_cleaner.py telegram_manager_web.py
      - run: python -m pytest -q
